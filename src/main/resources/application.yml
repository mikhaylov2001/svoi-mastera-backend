server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    # НЕ указываем driver-class-name — Spring сам определит по URL
    # postgres URL → postgresql driver, h2 URL → h2 driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
      # НЕ указываем dialect явно — Hibernate сам определит по драйверу
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
