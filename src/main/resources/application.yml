server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

# Верификация: auto-approve=true — галочка сразу после отправки документов и ЭП (удобно для демо).
# Для ручной модерации: false + ADMIN_VERIFICATION_KEY + POST /verification/admin/users/{userId}/approve
app:
  public-base-url: ${APP_PUBLIC_BASE_URL:https://svoi-mastera-backend-ntp0.onrender.com}
  verification:
    auto-approve: ${VERIFICATION_AUTO_APPROVE:true}
    admin-key: ${ADMIN_VERIFICATION_KEY:}