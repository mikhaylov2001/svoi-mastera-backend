server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  jpa:
    hibernate:
      # ВАЖНО: меняем update на validate — Flyway теперь управляет схемой
      # update будет конфликтовать с Flyway миграциями
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # baseline-version: 1 — считаем что V1 уже применена (текущая схема)
    baseline-version: 1

  # Максимальный размер файлов для загрузки (фото, видео, голосовые)
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB